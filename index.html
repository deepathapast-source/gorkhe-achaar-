<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gorkhe Achaar</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <!-- Your CSS -->
  <link rel="stylesheet" href="style.css">
  <style>
    /* ----- Body & Main Background ----- */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: url("images/himalaya.jpg") no-repeat center center fixed;
      background-size: cover;
    }

    /* ----- Header Banner ----- */
    .header-banner {
      position: relative;
      height: 300px;
      background: url("images/bg.jpg") no-repeat center center;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .header-banner .overlay {
      background: rgba(0,0,0,0.5);
      border-radius: 10px;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Logo above heading */
    .header-banner .logo {
      width: 100px;
      height: auto;
      margin-bottom: 15px;
      z-index: 2;
    }

    /* Main Heading */
    .header-banner h1 {
      font-family: 'Anton', 'Impact', sans-serif;
      font-size: 50px;
      color: maroon;
      -webkit-text-stroke: 1.5px #FFDB58;
      text-stroke: 1.5px #FFDB58;
      margin: 5px 0;
      line-height: 1.1;
    }

    /* Responsive heading for mobile */
    @media (max-width: 768px) {
      .header-banner h1 {
        font-size: 40px;
      }
      .header-banner .logo {
        width: 80px;
      }
    }

    /* Subtitle */
    .header-banner .subtitle {
      font-family: 'Great Vibes', cursive;
      color: deepskyblue;
      font-size: 20px;
      margin-bottom: 10px;
    }

    /* Manufacturer Info */
    .header-banner .manufacturer {
      font-size: 14px;
      line-height: 1;
      color: white;
      text-align: center;
      margin-top: 10px;
    }

    /* ----- Products Grid ----- */
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .product {
      background: rgba(255,255,255,0.9);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .image-wrapper {
      width: 180px;
      height: 180px;
      overflow: hidden;
      margin: 5px auto;
      border-radius: 8px;
    }

    .image-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    select {
      padding: 5px;
      margin: 5px 0;
    }

    button {
      background: maroon;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 5px;
      cursor: pointer;
    }

    /* ----- Video Section ----- */
    .video-section {
      text-align: center;
      padding: 20px;
      margin: 20px 20px 10px 20px;
      background: rgba(255,255,255,0.85);
      border-radius: 10px;
    }

    .video-section video {
      max-width: 100%;
      border-radius: 10px;
    }

    /* ----- Footer ----- */
    .footer {
      background: rgba(0,0,0,0.6);
      color: white;
      text-align: center;
      padding: 15px 10px;
      font-size: 14px;
    }

  </style>
</head>
<body>

  <!-- Header Banner -->
  <header class="header-banner">
    <div class="overlay">
      <img src="images/logo.png" alt="Gorkhe Achaar Logo" class="logo">
      <h1>Gorkhe Achaar</h1>
      <p class="subtitle">Authentic Himalayan Pickles & Fermented Delicacies</p>
      <div class="manufacturer">
        <p><strong>Manufactured by:</strong></p>
        <p>REGAL SALES</p>
        <p>Malbazar, Jalpaiguri</p>
        <p>West Bengal, PIN- 735230</p>
      </div>
    </div>
  </header>

  <!-- Products Grid -->
  <div class="products">
    <!-- Paste your product cards here -->
  </div>

  <!-- Video Section -->
  <div class="video-section">
    <h2>How We Make Gorkhe Achaar</h2>
    <video controls>
      <source src="images/pickle-process.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- Footer -->
  <div class="footer">
    For any complaints, suggestions, bulk order and whole sellers- contact on email: regalsales0@gmail.com or call 7007408361
  </div>

  <script>
    function updatePrice(selectElement){
      const price = selectElement.value;
      const productCard = selectElement.closest(".product");
      const priceSpan = productCard.querySelector("p span");
      if(priceSpan){
        priceSpan.textContent = price;
      }
    }

    function orderNow(productName){
      const msg = `Hello, I want to order:\nProduct: ${productName}`;
      const url = "https://wa.me/919832063165?text=" + encodeURIComponent(msg);
      window.open(url, "_blank");
    }
  </script>

</body>
</html>
